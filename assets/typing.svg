<svg xmlns="http://www.w3.org/2000/svg" width="800" height="60" viewBox="0 0 800 60" role="img" aria-label="Ashish Kumar Nishad - ACM and MLCOE Roles">
  <style>
    
@keyframes cl0 {
  0%, 0.00% { width: 0; animation-timing-function: steps(33, end); }
  17.50%, 45.00% { width: 435.6px; }
  50.00%, 100% { width: 0; }
}
    
@keyframes cr0 {
  0%, -0.01% { opacity: 0; transform: translateX(0); }
  0.00% { opacity: 1; transform: translateX(0); animation-timing-function: steps(33, end); }
  17.50%, 49.99% { opacity: 1; transform: translateX(435.6px); }
  50.00%, 100% { opacity: 0; transform: translateX(435.6px); }
}
    .cl0 { animation: cl0 8s linear infinite; }
    .cr0 { animation: cr0 8s linear infinite; }
    
@keyframes cl1 {
  0%, 50.00% { width: 0; animation-timing-function: steps(28, end); }
  67.50%, 95.00% { width: 369.6px; }
  100.00%, 100% { width: 0; }
}
    
@keyframes cr1 {
  0%, 49.99% { opacity: 0; transform: translateX(0); }
  50.00% { opacity: 1; transform: translateX(0); animation-timing-function: steps(28, end); }
  67.50%, 99.99% { opacity: 1; transform: translateX(369.6px); }
  100.00%, 100% { opacity: 0; transform: translateX(369.6px); }
}
    .cl1 { animation: cl1 8s linear infinite; }
    .cr1 { animation: cr1 8s linear infinite; }
    @media (prefers-reduced-motion: reduce) {
      .cl0 { animation: none; width: 409.2px; }
      .cl1, rect[class^="cr"] { animation: none; opacity: 0; }
    }
  </style>
  <defs>
    <clipPath id="c0"><rect class="cl0" x="182.2" y="0" width="0" height="60"/></clipPath>
    <clipPath id="c1"><rect class="cl1" x="215.2" y="0" width="0" height="60"/></clipPath>
  </defs>
  
  <g clip-path="url(#c0)">
    <text x="182.2" y="38" textLength="435.6" lengthAdjust="spacing" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="22" font-weight="600">
      <tspan fill="#38bdf8">> </tspan>
      <tspan fill="#f0f9ff">Treasurer @ ACM Student Chapter</tspan>
    </text>
  </g>

  <g clip-path="url(#c1)">
    <text x="215.2" y="38" textLength="369.6" lengthAdjust="spacing" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="22" font-weight="600">
      <tspan fill="#38bdf8">> </tspan>
      <tspan fill="#f0f9ff">Backend Dev Member @ MLCOE</tspan>
    </text>
  </g>
  <rect class="cr0" x="182.2" y="17" width="11" height="26" fill="#38bdf8" rx="2"/>
  <rect class="cr1" x="215.2" y="17" width="11" height="26" fill="#38bdf8" rx="2"/>
</svg>